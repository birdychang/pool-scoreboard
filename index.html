<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b2e23"/>
<title>撞球計分板 · Race to X</title>
<style>
:root{
  --felt:#0e3a2b; --felt2:#08231a; --gold:#e8c15a; --red:#ff5a5f;
  --ink:#f5f1e6; --dim:#9db8a9; --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(130% 110% at 50% 0%,#155843 0%,var(--felt) 48%,var(--felt2) 100%);
  color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
.hidden{display:none!important}

/* ---------- setup ---------- */
#setup{max-width:520px;margin:0 auto;padding:28px 20px 60px}
#setup h1{font-size:26px;margin:6px 0 2px;letter-spacing:1px}
#setup .sub{color:var(--dim);font-size:14px;margin:0 0 22px}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;color:var(--dim);margin-bottom:8px;letter-spacing:1px}
.field input[type=text],.field input[type=number]{
  width:100%;font-size:20px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);outline:none;
}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{
  flex:1;min-width:60px;padding:12px 0;font-size:18px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);
}
.seg button.on{background:var(--gold);color:#20301f;border-color:var(--gold);font-weight:700}
.radio-row{display:flex;gap:8px}
.radio-row button{
  flex:1;padding:12px 0;font-size:16px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);
}
.radio-row button.on{background:var(--gold);color:#20301f;border-color:var(--gold);font-weight:700}
#startBtn{
  width:100%;margin-top:26px;padding:16px;font-size:20px;font-weight:700;border:none;border-radius:14px;
  background:var(--gold);color:#20301f;letter-spacing:2px;
}
#continueBtn{
  width:100%;margin-top:12px;padding:14px;font-size:16px;border-radius:14px;
  background:transparent;color:var(--gold);border:1px solid var(--gold);
}

/* ---------- game ---------- */
#game{min-height:100vh;display:flex;flex-direction:column;max-width:900px;margin:0 auto;padding:10px 12px calc(14px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 10px;font-size:14px;color:var(--dim)}
.topbar .mid{text-align:center}
#raceLbl{color:var(--gold);font-weight:700;font-size:15px}
#rackLbl{font-size:13px}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:14px}
.panels{flex:1;display:flex;gap:10px;min-height:0}
@media (max-aspect-ratio: 3/4){ .panels{flex-direction:column} }
.panel{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 8px;position:relative;min-height:0;
}
.panel .pname{font-size:clamp(18px,4.5vw,26px);font-weight:700;letter-spacing:1px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel .pscore{font-size:clamp(84px,22vw,170px);font-weight:800;line-height:1;margin:2px 0;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.badges{min-height:30px;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:1px}
.badge.hill{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
.badge.brk{background:var(--gold);color:#20301f}
.badge.need{background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:400}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.addbtn{
  margin-top:10px;width:100%;max-width:280px;padding:16px 0;font-size:20px;font-weight:800;letter-spacing:2px;
  border:none;border-radius:14px;background:var(--gold);color:#20301f;
}
.addbtn:active{transform:scale(.97)}
.toolbar{display:flex;gap:8px;margin-top:10px}
.toolbar button{
  flex:1;padding:13px 0;font-size:15px;border-radius:12px;background:var(--card);
  border:1px solid var(--line);color:var(--ink);
}
.toolbar button:active{background:rgba(255,255,255,.12)}
#seqStrip{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;padding:10px 4px 2px;min-height:22px}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--line)}
.dot.p1{background:var(--gold);border-color:var(--gold)}
.dot.p2{background:#7fb2ff;border-color:#7fb2ff}

/* ---------- win overlay ---------- */
#winOverlay{position:fixed;inset:0;background:rgba(4,14,10,.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
#winOverlay .card{text-align:center;max-width:420px;width:100%;background:var(--card);border:1px solid var(--gold);border-radius:20px;padding:36px 24px}
#winOverlay .trophy{font-size:64px}
#winOverlay h2{font-size:30px;margin:10px 0 4px;color:var(--gold)}
#winOverlay .final{font-size:18px;color:var(--dim);margin-bottom:6px}
#winOverlay .wtime{font-size:14px;color:var(--dim);margin-bottom:22px}
#winOverlay .card button{display:block;width:100%;margin-top:10px;padding:14px;font-size:17px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#winOverlay .card button.primary{background:var(--gold);color:#20301f;border:none;font-weight:700}
</style>
</head>
<body>

<!-- ============ 設定畫面 ============ -->
<div id="setup">
  <h1>🎱 撞球計分板</h1>
  <p class="sub">Race to X · 存在這台裝置的瀏覽器裡，斷網也能用</p>

  <div class="field">
    <label>選手一</label>
    <input type="text" id="inP1" value="選手一" maxlength="12"/>
  </div>
  <div class="field">
    <label>選手二</label>
    <input type="text" id="inP2" value="選手二" maxlength="12"/>
  </div>
  <div class="field">
    <label>RACE TO（先到幾盤贏）</label>
    <div class="seg" id="raceSeg">
      <button data-v="3">3</button><button data-v="5" class="on">5</button><button data-v="7">7</button>
      <button data-v="9">9</button><button data-v="11">11</button><button data-v="13">13</button>
    </div>
  </div>
  <div class="field">
    <label>開球規則</label>
    <div class="radio-row" id="breakRuleSeg">
      <button data-v="alt" class="on">交替開球</button>
      <button data-v="winner">贏家開球</button>
    </div>
  </div>
  <div class="field">
    <label>第一盤開球</label>
    <div class="radio-row" id="firstBreakSeg">
      <button data-v="p1" class="on">選手一</button>
      <button data-v="p2">選手二</button>
    </div>
  </div>

  <button id="startBtn">開始比賽</button>
  <button id="continueBtn" class="hidden"></button>
</div>

<!-- ============ 計分畫面 ============ -->
<div id="game" class="hidden">
  <div class="topbar">
    <button class="iconbtn" id="btnHome">‹ 設定</button>
    <div class="mid">
      <div id="raceLbl">RACE TO 5</div>
      <div id="rackLbl">第 1 盤 · ⏱ 00:00</div>
    </div>
    <button class="iconbtn" id="btnSwap">⇄ 換邊</button>
  </div>

  <div class="panels">
    <div class="panel" id="panel1">
      <div class="pname" id="name1">選手一</div>
      <div class="pscore" id="score1">0</div>
      <div class="badges" id="badges1"></div>
      <button class="addbtn" id="add1">＋1 拿下此盤</button>
    </div>
    <div class="panel" id="panel2">
      <div class="pname" id="name2">選手二</div>
      <div class="pscore" id="score2">0</div>
      <div class="badges" id="badges2"></div>
      <button class="addbtn" id="add2">＋1 拿下此盤</button>
    </div>
  </div>

  <div id="seqStrip"></div>

  <div class="toolbar">
    <button id="btnUndo">↩ 復原上一步</button>
    <button id="btnReset">🔄 比分歸零</button>
    <button id="btnNew">🏁 新比賽</button>
  </div>
</div>

<!-- ============ 勝利畫面 ============ -->
<div id="winOverlay" class="hidden">
  <div class="card">
    <div class="trophy">🏆</div>
    <h2 id="winName">選手一 獲勝！</h2>
    <div class="final" id="winScore"></div>
    <div class="wtime" id="winTime"></div>
    <button class="primary" id="btnRematch">再來一場（比分歸零）</button>
    <button id="btnWinUndo">↩ 剛剛按錯了，復原</button>
    <button id="btnWinNew">回主畫面開新比賽</button>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const LS_KEY = "poolScoreboardV1";
let S = null;      // 目前比賽狀態
let timerId = null;

/* ---------- 小工具 ---------- */
function segInit(elId, cb){
  const el = $(elId);
  el.addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    el.querySelectorAll("button").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); cb(b.dataset.v);
  });
  const on = el.querySelector("button.on");
  return on ? on.dataset.v : null;
}
function fmtTime(ms){
  const s = Math.floor(ms/1000);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60;
  const p = n => String(n).padStart(2,"0");
  return h > 0 ? `${p(h)}:${p(m)}:${p(ss)}` : `${p(m)}:${p(ss)}`;
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function loadSaved(){ try{ const r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function clearSaved(){ try{ localStorage.removeItem(LS_KEY); }catch(e){} }

/* ---------- 設定畫面 ---------- */
let raceTo = 5, breakRule = "alt", firstBreak = "p1";
segInit("raceSeg", v => raceTo = parseInt(v,10));
segInit("breakRuleSeg", v => breakRule = v);
segInit("firstBreakSeg", v => firstBreak = v);

// 繼續上次比賽
(function(){
  const sv = loadSaved();
  if(sv && !sv.done){
    const b = $("continueBtn");
    b.classList.remove("hidden");
    b.textContent = `繼續上次比賽：${sv.n1} ${sv.s1} – ${sv.s2} ${sv.n2}（Race to ${sv.raceTo}）`;
    b.onclick = () => { S = sv; raceTo = sv.raceTo; breakRule = sv.breakRule; showGame(); };
  }
})();

$("startBtn").onclick = () => {
  const n1 = $("inP1").value.trim() || "選手一";
  const n2 = $("inP2").value.trim() || "選手二";
  S = { n1, n2, raceTo, breakRule, firstBreak,
        s1:0, s2:0, breaker:firstBreak, rack:1,
        seq:[], hist:[], t0:Date.now(), done:false };
  // 開球選擇器的標籤跟著名字
  save(); showGame();
};

/* ---------- 計分邏輯 ---------- */
function snap(){ return { s1:S.s1, s2:S.s2, breaker:S.breaker, rack:S.rack, seq:S.seq.slice() }; }

function score(side){  // side: "p1" | "p2"
  if(S.done) return;
  S.hist.push(snap());
  if(side === "p1") S.s1++; else S.s2++;
  S.seq.push(side === "p1" ? 1 : 2);
  const sc = side === "p1" ? S.s1 : S.s2;
  if(sc >= S.raceTo){
    S.done = true; save(); render(); showWin(side); return;
  }
  S.breaker = (S.breakRule === "winner") ? side : (S.breaker === "p1" ? "p2" : "p1");
  S.rack++;
  save(); render();
}

function undo(){
  const h = S.hist.pop();
  if(!h) return;
  S.s1 = h.s1; S.s2 = h.s2; S.breaker = h.breaker; S.rack = h.rack; S.seq = h.seq;
  S.done = false;
  $("winOverlay").classList.add("hidden");
  save(); render();
}

function resetRacks(){
  if(!confirm("比分歸零、重新開始這場比賽？")) return;
  S.s1 = 0; S.s2 = 0; S.rack = 1; S.breaker = S.firstBreak;
  S.seq = []; S.hist = []; S.t0 = Date.now(); S.done = false;
  $("winOverlay").classList.add("hidden");
  save(); render();
}

function swapSides(){
  const t = S.n1; S.n1 = S.n2; S.n2 = t;
  const s = S.s1; S.s1 = S.s2; S.s2 = s;
  S.breaker = S.breaker === "p1" ? "p2" : "p1";
  S.firstBreak = S.firstBreak === "p1" ? "p2" : "p1";
  S.seq = S.seq.map(x => x === 1 ? 2 : 1);
  S.hist = []; // 換邊後歷史作廢，避免復原錯亂
  save(); render();
}

/* ---------- 畫面 ---------- */
function showGame(){
  $("setup").classList.add("hidden");
  $("game").classList.remove("hidden");
  $("winOverlay").classList.add("hidden");
  $("inP1").value = S.n1; $("inP2").value = S.n2;
  render();
  clearInterval(timerId);
  timerId = setInterval(renderClock, 1000);
}
function showSetup(){
  clearInterval(timerId);
  $("game").classList.add("hidden");
  $("setup").classList.remove("hidden");
  location.reload(); // 回設定頁最乾淨，順便重整「繼續上次」按鈕
}

function renderClock(){
  if(!S) return;
  $("rackLbl").textContent = `第 ${S.rack} 盤 · ⏱ ${fmtTime(Date.now() - S.t0)}`;
}

function badgesHTML(side){
  const sc = side === "p1" ? S.s1 : S.s2;
  const nm = side === "p1" ? S.n1 : S.n2;
  let h = "";
  if(S.breaker === side) h += `<span class="badge brk">🎱 開球</span>`;
  if(sc === S.raceTo - 1 && S.raceTo > 1) h += `<span class="badge hill">HILL 聽牌</span>`;
  else if(sc < S.raceTo - 1) h += `<span class="badge need">還差 ${S.raceTo - sc} 盤</span>`;
  return h;
}

function render(){
  $("raceLbl").textContent = `RACE TO ${S.raceTo}`;
  $("name1").textContent = S.n1; $("name2").textContent = S.n2;
  $("score1").textContent = S.s1; $("score2").textContent = S.s2;
  $("badges1").innerHTML = badgesHTML("p1");
  $("badges2").innerHTML = badgesHTML("p2");
  $("seqStrip").innerHTML = S.seq.map(x => `<span class="dot p${x}"></span>`).join("");
  renderClock();
}

function showWin(side){
  const nm = side === "p1" ? S.n1 : S.n2;
  $("winName").textContent = `${nm} 獲勝！`;
  $("winScore").textContent = `${S.n1} ${S.s1} – ${S.s2} ${S.n2} · Race to ${S.raceTo}`;
  $("winTime").textContent = `用時 ${fmtTime(Date.now() - S.t0)} · 共 ${S.rack} 盤`;
  $("winOverlay").classList.remove("hidden");
}

$("add1").onclick = () => score("p1");
$("add2").onclick = () => score("p2");
$("btnUndo").onclick = undo;
$("btnReset").onclick = resetRacks;
$("btnSwap").onclick = swapSides;
$("btnNew").onclick = () => { if(confirm("結束這場比賽、回主畫面？")) showSetup(); };
$("btnHome").onclick = () => showSetup();
$("btnRematch").onclick = resetRacks;
$("btnWinUndo").onclick = undo;
$("btnWinNew").onclick = showSetup;

// 避免 iOS 雙擊縮放
document.addEventListener("dblclick", e => e.preventDefault(), { passive:false });
</script>
</body>
</html>
